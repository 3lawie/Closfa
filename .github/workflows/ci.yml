name: CI
on:
  # Push builds only on long-lived branches; PRs from any branch get the full run
  # (avoids double-running a job for same-repo PR branches).
  push:
    branches: ["main", "ai"]
  pull_request:
    branches: ["**"]
jobs:
  quality:
    runs-on: ubuntu-latest
    # Placeholder client env so any test that transitively imports client-env.ts
    # (which fails closed at module load without these) doesn't break CI. These
    # are public-by-design client config, not secrets.
    env:
      VITE_PUBLIC_IMAGEKIT_PUBLIC_KEY: "ci-placeholder"
      VITE_PUBLIC_IMAGEKIT_URL_ENDPOINT: "https://ik.imagekit.io/ci"
      VITE_PUBLIC_AUTH0_DOMAIN: "ci-placeholder.auth0.com"
      VITE_PUBLIC_AUTH0_CLIENT_ID: "ci-placeholder"
      VITE_PUBLIC_SITE_URL: "https://closfa.mly445032.workers.dev"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # Hard gates: typecheck + tests must pass.
      - name: TypeScript check
        run: npm run typecheck
      - name: Test
        run: npm run test
      # Now a hard gate. The lint backlog this used to tolerate (46 errors, the
      # bulk of them documented Drizzle-beta `as any` casts) has been cleared —
      # the genuinely unavoidable ones are scoped in eslint.config.js instead of
      # being tolerated repo-wide, so anything new that appears here is real.
      - name: Lint
        run: npm run lint
