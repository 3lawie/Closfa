<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Closfa mark — the two overlapping "connection / awareness" circles from
    src/components/layout/Logo.tsx, adapted for a favicon:

    • Colour is hardcoded. The component fills with var(--accent), which cannot
      resolve here: a favicon is loaded as a standalone document with no
      cascade from the page. #68b986 is oklch(0.72 0.110 155), the light-theme
      accent; the media query below swaps to the dark-theme value.
    • Solid fills, not opacity 0.85/0.5. At 16px the translucent overlap of the
      original renders as an indistinct blob.
    • Recentred. The source circles sit off-centre in their 28-unit viewBox
      (bbox roughly x 2→24.5, y 3.5→24); these are balanced in 32 with an
      even margin so the mark isn't visually lopsided in a browser tab.
  -->
  <style>
    .mark { fill: #68b986 }
    @media (prefers-color-scheme: dark) { .mark { fill: #85ca9d } }
  </style>
  <circle class="mark" cx="12.5" cy="19" r="10" />
  <circle class="mark" cx="21" cy="11" r="7" fill-opacity="0.62" />
</svg>
